<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Box Model Example</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        .box {
            width: 250px;                 
            height: 120px;              
            padding: 20px;              
            border: 5px solid blue;       
            margin: 40px;                 
            background-color: lightyellow;
            text-align: center;
            line-height: 80px;
            font-size: 18px;
            box-sizing: border-box;        
        }
    </style>
</head>
<body>
    <div class="box">
        CSS Box Model
    </div>
</body>
</html>
