<!DOCTYPE html>
<html>
<head>
    <title>HTML List Types</title>
</head>
<body>
    <h2>Ordered List</h2>
    <ol>
        <li>Doremon</li>
        <li>Shinchan</li>
        <li>Chotabheem</li>
    </ol>
    <h2>Unordered List</h2>
    <ul>
        <li>Pen</li>
        <li>Pencil</li>
        <li>Eraser</li>
    </ul>
    <h2>Ordered List with Type</h2>
    <ol type="A">
        <li>Maths</li>
        <li>Physics</li>
        <li>English</li>
    </ol>
    <h2>Nested List</h2>
    <ul>
        <li>Frontend
            <ul>
            <li>HTML</li>
            <li>CSS</li>
          </ul>
        </li>
<li>Backend
  <ul>
    <li>Java</li>
    <li>Python</li>
  </ul>
</li>
  </ul>

</body>
</html>
