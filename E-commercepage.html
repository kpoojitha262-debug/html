<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Product Page</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 80%;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 30px;
            display: flex;
            gap: 40px;
            box-sizing: border-box;
            border-radius: 10px;
        }

        /* Product Image */
        .product-image {
            width: 40%;
        }

        .product-image img {
            width: 100%;
            border-radius: 10px;
        }

        /* Product Details */
        .product-details {
            width: 60%;
        }

        .product-details h1 {
            margin-top: 0;
            color: #333;
        }

        .price {
            font-size: 24px;
            color: #e60000;
            margin: 10px 0;
        }

        .description {
            font-size: 15px;
            color: #555;
            margin-bottom: 20px;
        }

        .features {
            margin-bottom: 20px;
        }

        .features li {
            margin-bottom: 8px;
            color: #444;
        }

        .buttons button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 15px;
        }

        .add-cart {
            background-color: #ff9f00;
            color: white;
        }

        .buy-now {
            background-color: #fb641b;
            color: white;
        }

        .buttons button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Product Image -->
        <div class="product-image">
            <img src="C:\Users\STUDENT\Desktop\4212\headphones.jpg" alt="Product Image">
        </div>

        <!-- Product Details -->
        <div class="product-details">
            <h1>Wireless Headphones</h1>

            <div class="price">₹2,499</div>

            <p class="description">
                Experience high-quality sound with these wireless headphones.
                Designed for comfort and long listening hours.
            </p>

            <ul class="features">
                <li>Bluetooth Connectivity</li>
                <li>Noise Cancellation</li>
                <li>20 Hours Battery Life</li>
                <li>Fast Charging Support</li>
            </ul>

            <div class="buttons">
                <button class="add-cart">Add to Cart</button>
                <button class="buy-now">Buy Now</button>
            </div>
        </div>

    </div>

</body>
</html>
